# T02.05 sandbox probe. Copy to .github/workflows/oidc-probe.yml in the SANDBOX repo only (never in peos-trust-cli).
# It requests an OIDC token for a dedicated audience inside the protected environment and stores it for 1 day.
name: oidc-probe
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: peos-protected
    steps:
      - name: Request OIDC token
        run: |
          set -euo pipefail
          resp=$(curl -sS --fail -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=peos-sandbox-t0205")
          printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"], end="")' > oidc-token.jwt
          printf '%s\n' "run_id=${GITHUB_RUN_ID} run_attempt=${GITHUB_RUN_ATTEMPT} sha=${GITHUB_SHA} ref=${GITHUB_REF}" > run-info.txt
      - name: Upload token (1 day)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (same pin as peos-trust-cli ci.yml)
        with:
          name: oidc-token
          path: |
            oidc-token.jwt
            run-info.txt
          retention-days: 1
